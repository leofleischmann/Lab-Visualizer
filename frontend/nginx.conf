server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx-Version nicht preisgeben
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Sicherheits-Header (gelten für alle Antworten dieses Servers) ──
    # Hinweis: Ein nested `add_header` in einer location setzt geerbte Header außer
    # Kraft — die /assets-location nutzt daher bewusst nur `expires` (kein add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HTTPS erzwingen (öffentlicher Zugriff läuft über Cloudflare/HTTPS).
    add_header Strict-Transport-Security "max-age=15552000" always;
    # Content-Security-Policy: alles same-origin; 'unsafe-inline' nur für Styles,
    # da React/React Flow Inline-Styles setzen. Keine externen Quellen (offline-fähig).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;

    # REST-API an das Backend durchreichen
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare-Client-IP für serverseitiges Rate-Limiting durchreichen.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        client_max_body_size 25m;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Build-Assets dürfen lange gecacht werden (erbt die Sicherheits-Header,
    # da hier kein eigener add_header steht).
    location /assets/ {
        expires 30d;
    }
}
