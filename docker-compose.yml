# Lab Visualizer — Compose
# Backend und Frontend sind getrennt versioniert:
#   backend/VERSION  -> BACKEND_VERSION  -> lab-visualizer-backend:$tag
#   frontend/VERSION -> FRONTEND_VERSION -> lab-visualizer-frontend:$tag
#
# Lokal / Deploy:
#   export BACKEND_VERSION=$(tr -d '[:space:]' < backend/VERSION)
#   export FRONTEND_VERSION=$(tr -d '[:space:]' < frontend/VERSION)
# Oder in .env setzen. Defaults unten = aktuelle Release-Stände.
#
# GHCR (nach jeweiligem Versions-Bump auf main):
#   ghcr.io/leofleischmann/lab-visualizer-backend:$BACKEND_VERSION
#   ghcr.io/leofleischmann/lab-visualizer-frontend:$FRONTEND_VERSION
#
# Beeinflusst: .github/workflows/release.yml, Dockerfiles (ARG VERSION),
# GET /api/health (APP_VERSION nur Backend).

services:
  backend:
    image: ghcr.io/leofleischmann/lab-visualizer-backend:${BACKEND_VERSION:-1.0.0}
    build:
      context: ./backend
      args:
        VERSION: ${BACKEND_VERSION:-1.0.0}
    container_name: labviz-backend
    restart: unless-stopped
    # NODE_ENV=production kommt aus dem Image → Secure-Cookies sind in Produktion Standard.
    volumes:
      # SQLite-Datenbank (inkl. Accounts & Sessions) → Backup = diesen Ordner kopieren
      - ./data:/data
    environment:
      # Secure-Cookies: leer lassen → in Produktion (NODE_ENV=production) automatisch AN.
      # Nur auf "false" setzen, wenn du die Prod-Images lokal über http://localhost testest.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Gültigkeitsdauer einer Session in Tagen (Sliding-Renewal).
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      # Selbst-Registrierung erlauben ("true") oder sperren ("false").
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      # Optional: erlaubte Cross-Origin(s) mit Credentials (leer = nur same-origin).
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Instanz-Limits (leer = unbegrenzt). Keine Bezahlschranke, sondern
      # Missbrauchsschutz für öffentlich erreichbare Instanzen — siehe .env.example.
      - MAX_PROJECTS_PER_USER=${MAX_PROJECTS_PER_USER:-}
      - MAX_VIEWS_PER_PROJECT=${MAX_VIEWS_PER_PROJECT:-}
      - MAX_NODES_PER_PROJECT=${MAX_NODES_PER_PROJECT:-}
      # Schreib-Requests pro Minute und IP (0 = aus).
      - RATE_LIMIT_WRITES_PER_MIN=${RATE_LIMIT_WRITES_PER_MIN:-600}
      # Maximale Body-Größe (nur der Graph-Import braucht viel).
      - MAX_BODY=${MAX_BODY:-2mb}
      - MAX_IMPORT_BODY=${MAX_IMPORT_BODY:-20mb}
    # Protokolle rollierend begrenzen: Zugriffslogs enthalten IP-Adressen und
    # sollen sich nicht unbegrenzt ansammeln (siehe Datenschutzerklärung).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: API zusätzlich direkt (ohne Frontend-Proxy) freigeben:
    # ports:
    #   - "3000:3000"

  frontend:
    image: ghcr.io/leofleischmann/lab-visualizer-frontend:${FRONTEND_VERSION:-1.0.0}
    build:
      context: ./frontend
      args:
        VERSION: ${FRONTEND_VERSION:-1.0.0}
    container_name: labviz-frontend
    restart: unless-stopped
    depends_on:
      # Erst starten, wenn das Backend laut Healthcheck bereit ist.
      backend:
        condition: service_healthy
    # Protokolle rollierend begrenzen: Zugriffslogs enthalten IP-Adressen und
    # sollen sich nicht unbegrenzt ansammeln (siehe Datenschutzerklärung).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
