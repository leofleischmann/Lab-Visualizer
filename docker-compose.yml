# Lab Visualizer — Compose
# Backend and frontend are versioned independently:
#   backend/VERSION  -> BACKEND_VERSION  -> lab-visualizer-backend:$tag
#   frontend/VERSION -> FRONTEND_VERSION -> lab-visualizer-frontend:$tag
#
# Local / deploy:
#   export BACKEND_VERSION=$(tr -d '[:space:]' < backend/VERSION)
#   export FRONTEND_VERSION=$(tr -d '[:space:]' < frontend/VERSION)
# Or set them in .env. The defaults below are the current releases.
#
# GHCR (published on a version bump on main):
#   ghcr.io/leofleischmann/lab-visualizer-backend:$BACKEND_VERSION
#   ghcr.io/leofleischmann/lab-visualizer-frontend:$FRONTEND_VERSION
#
# Related: .github/workflows/release.yml, the Dockerfiles (ARG VERSION),
# GET /api/health (APP_VERSION, backend only).
#
# Every variable the backend reads must be passed through below, otherwise a
# value in .env never reaches the container. backend/test/config.test.js checks
# this against process.env usages in backend/src/.

services:
  backend:
    image: ghcr.io/leofleischmann/lab-visualizer-backend:${BACKEND_VERSION:-1.1.0}
    build:
      context: ./backend
      args:
        VERSION: ${BACKEND_VERSION:-1.1.0}
    container_name: labviz-backend
    restart: unless-stopped
    # NODE_ENV=production comes from the image -> secure cookies are the default.
    volumes:
      # SQLite database (accounts and sessions included) -> back up this folder
      - ./data:/data
    environment:
      # Secure cookies: leave empty -> automatically ON in production.
      # Set to "false" only when testing the prod images over http://localhost.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Session lifetime in days (sliding renewal).
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      # Allow ("true") or block ("false") self-registration.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      # Optional: allowed cross-origin(s) with credentials (empty = same-origin only).
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Instance limits (empty = unlimited). Not a paywall — abuse protection
      # for publicly reachable instances, see .env.example.
      - MAX_PROJECTS_PER_USER=${MAX_PROJECTS_PER_USER:-}
      - MAX_VIEWS_PER_PROJECT=${MAX_VIEWS_PER_PROJECT:-}
      - MAX_NODES_PER_PROJECT=${MAX_NODES_PER_PROJECT:-}
      - MAX_ASSETS_PER_USER=${MAX_ASSETS_PER_USER:-}
      # Largest image upload in bytes (empty = 1048576). Must fit into MAX_BODY
      # including the one-third base64 overhead.
      - MAX_ASSET_BYTES=${MAX_ASSET_BYTES:-}
      # Write requests per minute and IP (0 = off).
      - RATE_LIMIT_WRITES_PER_MIN=${RATE_LIMIT_WRITES_PER_MIN:-600}
      # Maximum body size (only the graph import needs a lot).
      - MAX_BODY=${MAX_BODY:-2mb}
      - MAX_IMPORT_BODY=${MAX_IMPORT_BODY:-20mb}
      # Legal texts (empty = /data/legal inside the volume).
      - LEGAL_DIR=${LEGAL_DIR:-}
      # "[Debug …]" lines in the backend log (API keys, MCP calls). Empty = off.
      - DEBUG_LOG=${DEBUG_LOG:-}
    # Rotate logs: access logs contain IP addresses and should not pile up
    # indefinitely (see the privacy policy).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: expose the API directly (bypassing the frontend proxy):
    # ports:
    #   - "3000:3000"

  frontend:
    image: ghcr.io/leofleischmann/lab-visualizer-frontend:${FRONTEND_VERSION:-1.1.0}
    build:
      context: ./frontend
      args:
        VERSION: ${FRONTEND_VERSION:-1.1.0}
    container_name: labviz-frontend
    restart: unless-stopped
    depends_on:
      # Start only once the backend passes its health check.
      backend:
        condition: service_healthy
    # Rotate logs: access logs contain IP addresses and should not pile up
    # indefinitely (see the privacy policy).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
