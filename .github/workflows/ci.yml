name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Mehrere Pushes auf denselben Branch: nur der letzte Lauf zaehlt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    # Bewusst GitHub-hosted statt self-hosted: hier laeuft Code aus fremden
    # Pull Requests, der niemals auf den Deploy-Server gehoert.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Tests
        working-directory: frontend
        run: npm test
      # `npm run build` fuehrt `tsc --noEmit` selbst aus (Typecheck + Bundle).
      - name: Typecheck & build
        working-directory: frontend
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose build
        run: |
          export BACKEND_VERSION=$(tr -d '[:space:]' < backend/VERSION)
          export FRONTEND_VERSION=$(tr -d '[:space:]' < frontend/VERSION)
          echo "[Debug ci]: BACKEND_VERSION=$BACKEND_VERSION FRONTEND_VERSION=$FRONTEND_VERSION"
          docker compose build
