# Veröffentlicht Backend- bzw. Frontend-Images auf GHCR unabhängig voneinander,
# sobald sich backend/VERSION bzw. frontend/VERSION auf main ändert.
#
# Pro Komponente: VERSION + package.json + CHANGELOG.md Abschnitt ## [X.Y.Z]
# Git-Tag: backend-vX.Y.Z bzw. frontend-vX.Y.Z
# Beeinflusst: Image-Tags, GitHub Releases, docker-compose (BACKEND_VERSION / FRONTEND_VERSION)
name: Release

on:
  push:
    branches: [main]
    paths:
      - backend/VERSION
      - frontend/VERSION
  workflow_dispatch:
    inputs:
      component:
        description: Welches Image releasen?
        type: choice
        options:
          - backend
          - frontend
          - both
        default: both

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Aenderungen erkennen
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      owner: ${{ steps.detect.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Erkennen
        id: detect
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

          BACKEND=false
          FRONTEND=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.component }}" in
              backend) BACKEND=true ;;
              frontend) FRONTEND=true ;;
              both) BACKEND=true; FRONTEND=true ;;
            esac
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              BACKEND=true
              FRONTEND=true
            else
              mapfile -t CHANGED < <(git diff --name-only "$BEFORE" "${{ github.sha }}")
              for f in "${CHANGED[@]}"; do
                [[ "$f" == "backend/VERSION" ]] && BACKEND=true
                [[ "$f" == "frontend/VERSION" ]] && FRONTEND=true
              done
            fi
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "[Debug release]: backend=$BACKEND frontend=$FRONTEND owner=$OWNER"

  publish-backend:
    name: Backend releasen
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version und Changelog
        id: meta
        env:
          OWNER: ${{ needs.plan.outputs.owner }}
        run: |
          set -euo pipefail
          COMPONENT=backend
          VERSION=$(tr -d '[:space:]' < "$COMPONENT/VERSION")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Ungueltige $COMPONENT/VERSION: '$VERSION'" >&2
            exit 1
          fi
          PV=$(node -p "require('./$COMPONENT/package.json').version")
          if [[ "$PV" != "$VERSION" ]]; then
            echo "$COMPONENT/package.json ($PV) weicht von VERSION ($VERSION) ab." >&2
            exit 1
          fi
          if ! grep -qE "^## \[${VERSION}\]" "$COMPONENT/CHANGELOG.md"; then
            echo "$COMPONENT/CHANGELOG.md hat keinen Abschnitt ## [${VERSION}]." >&2
            exit 1
          fi
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$COMPONENT/CHANGELOG.md" > /tmp/release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### Docker-Image"
            echo ""
            echo "- \`ghcr.io/${OWNER}/lab-visualizer-backend:${VERSION}\`"
            echo ""
            echo "\`\`\`bash"
            echo "export BACKEND_VERSION=${VERSION}"
            echo "docker compose pull backend"
            echo "docker compose up -d backend"
            echo "\`\`\`"
          } >> /tmp/release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=backend-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=lab-visualizer-backend" >> "$GITHUB_OUTPUT"
          echo "[Debug release]: $COMPONENT $VERSION -> backend-v${VERSION}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/lab-visualizer-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/lab-visualizer-backend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Lab Visualizer Backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Git-Tag und Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "[Debug release]: Tag $TAG existiert bereits — kein neues Release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Backend $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Backend $VERSION" \
            --notes-file /tmp/release-notes.md

  publish-frontend:
    name: Frontend releasen
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version und Changelog
        id: meta
        env:
          OWNER: ${{ needs.plan.outputs.owner }}
        run: |
          set -euo pipefail
          COMPONENT=frontend
          VERSION=$(tr -d '[:space:]' < "$COMPONENT/VERSION")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Ungueltige $COMPONENT/VERSION: '$VERSION'" >&2
            exit 1
          fi
          PV=$(node -p "require('./$COMPONENT/package.json').version")
          if [[ "$PV" != "$VERSION" ]]; then
            echo "$COMPONENT/package.json ($PV) weicht von VERSION ($VERSION) ab." >&2
            exit 1
          fi
          if ! grep -qE "^## \[${VERSION}\]" "$COMPONENT/CHANGELOG.md"; then
            echo "$COMPONENT/CHANGELOG.md hat keinen Abschnitt ## [${VERSION}]." >&2
            exit 1
          fi
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$COMPONENT/CHANGELOG.md" > /tmp/release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### Docker-Image"
            echo ""
            echo "- \`ghcr.io/${OWNER}/lab-visualizer-frontend:${VERSION}\`"
            echo ""
            echo "\`\`\`bash"
            echo "export FRONTEND_VERSION=${VERSION}"
            echo "docker compose pull frontend"
            echo "docker compose up -d frontend"
            echo "\`\`\`"
          } >> /tmp/release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=frontend-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "[Debug release]: $COMPONENT $VERSION -> frontend-v${VERSION}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/lab-visualizer-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/lab-visualizer-frontend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Lab Visualizer Frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Git-Tag und Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "[Debug release]: Tag $TAG existiert bereits — kein neues Release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Frontend $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Frontend $VERSION" \
            --notes-file /tmp/release-notes.md
