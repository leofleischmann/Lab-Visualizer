# Veröffentlicht Docker-Images auf GHCR, sobald sich VERSION auf main ändert.
# Single source of truth: /VERSION
# Beeinflusst: Image-Tags backend/frontend, Git-Tag vX.Y.Z, GitHub Release.
# Lokal bauen: VERSION=$(cat VERSION) docker compose build
name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Images bauen und veroeffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version lesen
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Ungueltige VERSION: '$VERSION'" >&2
            exit 1
          fi
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "[Debug release]: version=$VERSION owner=$OWNER"

      - name: package.json Versionen pruefen
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in backend/package.json frontend/package.json; do
            PV=$(node -p "require('./$pkg').version")
            if [[ "$PV" != "$VERSION" ]]; then
              echo "Version in $pkg ($PV) weicht von VERSION ($VERSION) ab." >&2
              exit 1
            fi
          done

      - name: Login bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend pushen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/lab-visualizer-backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/lab-visualizer-backend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend pushen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/lab-visualizer-frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/lab-visualizer-frontend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Git-Tag und Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "[Debug release]: Tag $TAG existiert bereits — kein neues Release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Docker-Images:
          - \`ghcr.io/${{ steps.version.outputs.owner }}/lab-visualizer-backend:${VERSION}\`
          - \`ghcr.io/${{ steps.version.outputs.owner }}/lab-visualizer-frontend:${VERSION}\`

          Start mit vorgebauten Images:
          \`\`\`bash
          export VERSION=${VERSION}
          docker compose pull
          docker compose up -d
          \`\`\`"
