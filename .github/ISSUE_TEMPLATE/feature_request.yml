name: Idea or request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could it look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
