name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security vulnerabilities here — use the process in
        [SECURITY.md](https://github.com/leofleischmann/Lab-Visualizer/blob/main/SECURITY.md).
  - type: textarea
    id: what-happens
    attributes:
      label: What happens?
      description: The observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new project
        2. Drag a node onto the canvas
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Backend and frontend version (VERSION files or image tags).
      placeholder: "Backend 1.0.0 / Frontend 1.0.0"
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Lab Visualizer?
      options:
        - Docker Compose
        - Local development (npm run dev)
        - Public instance (hosted by someone else)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Browser console and/or `docker compose logs backend`.
      render: shell
